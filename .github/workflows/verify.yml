name: Verify MicroportMap

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Preservation, navigation and recovery
        run: |
          python3 checks/validate.py
          python3 checks/navigation-round12.py
          python3 checks/site-navigation-audit.py
          python3 checks/site-recovery.py
      - name: Fifty visible interface improvements audit
        run: python3 checks/visual-50-audit.py
      - name: Capture desktop and mobile visual review screenshots
        run: bash checks/visual-50-browser-smoke.sh
      - name: Retain desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: microportmap-visible-release-50-previews
          path: checks/visual-50-screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
      - name: Atlas, directory, comparison and export regression
        run: |
          node --check src/site-redesign.js
          node checks/map-layer-transitions.cjs
          node checks/atlas.cjs
          node checks/directory.cjs
          node checks/passport.cjs
          node checks/compare.cjs
          node checks/record-field-2000.cjs
      - name: Two thousand visible-field safety cases
        run: node checks/visible-fields-2000.cjs
      - name: Two thousand cross-view filter and comparison handoffs
        run: node checks/cross-view-2000.cjs
      - name: Preserve cross-view audit ledgers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: microportmap-cross-view-2000
          path: |
            checks/cross-view-2000-results.json
            checks/cross-view-2000-ledger.json
            checks/cross-view-2000-status.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve visible-field audit ledgers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: microportmap-visible-fields-2000
          path: |
            checks/visible-fields-2000-results.json
            checks/visible-fields-2000-ledger.json
            checks/visible-fields-2000-status.json
          if-no-files-found: warn
          retention-days: 30
