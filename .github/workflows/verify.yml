name: Verify MicroportMap

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Preservation, navigation and recovery
        run: |
          python3 checks/validate.py
          python3 checks/navigation-round12.py
          python3 checks/site-navigation-audit.py
          python3 checks/site-recovery.py
      - name: Passport Reading 500 source and runtime action audit
        run: |
          python3 checks/passport-reading-500-audit.py
          node --check src/passport-reading-controls.js
          node checks/passport-reading-500.cjs
      - name: Passport Reading real-browser behavior and responsive captures
        run: bash checks/passport-reading-browser-smoke.sh
      - name: Retain Passport Reading 500 results and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: microportmap-passport-reading-500
          path: |
            checks/passport-reading-500-results.json
            checks/passport-reading-screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
      - name: Passport Quick Navigation 500 source and behavior audit
        run: |
          python3 checks/passport-quick-nav-500-audit.py
          node --check src/passport-quick-navigation.js
          node checks/passport-quick-nav-500.cjs
      - name: Passport Quick Navigation responsive browser smoke
        run: bash checks/passport-quick-nav-browser-smoke.sh
      - name: Retain Passport Quick Navigation screenshots and 500-case results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: microportmap-passport-quick-nav-500
          path: |
            checks/passport-quick-nav-500-results.json
            checks/passport-quick-nav-screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
      - name: Approximate Location 500 integrity and action audit
        run: |
          python3 checks/approximate-location-500-audit.py
          node --check src/approximate-location-tools.js
          node checks/approximate-location-500.cjs
      - name: Approximate Location browser smoke and screenshots
        run: bash checks/approximate-location-browser-smoke.sh
      - name: Archive Approximate Location 500 results and visuals
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: microportmap-approximate-location-500
          path: |
            checks/approximate-location-500-results.json
            checks/approximate-location-screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
      - name: Evidence Comparison 500 source and runtime matrix
        run: |
          python3 checks/project-evidence-500-audit.py
          node --check src/project-evidence-compare.js
          node checks/project-evidence-500.cjs
      - name: Evidence Comparison interactive browser and responsive captures
        run: bash checks/project-evidence-browser-smoke.sh
      - name: Retain Evidence Comparison 500 results and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: microportmap-evidence-compare-500
          path: |
            checks/project-evidence-500-results.json
            checks/project-evidence-screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
      - name: Field Inspector 500 source and runtime actions
        run: |
          python3 checks/field-inspector-500-audit.py
          node --check src/passport-field-inspector.js
          node checks/field-inspector-500.cjs
      - name: Field Inspector real-browser responsive smoke
        run: bash checks/field-inspector-browser-smoke.sh
      - name: Retain Field Inspector 500 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: microportmap-field-inspector-500
          path: |
            checks/field-inspector-500-results.json
            checks/field-inspector-screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
      - name: Review Workspace 500 source and task audit
        run: |
          python3 checks/review-workspace-500-audit.py
          node --check src/research-review-workspace.js
          node checks/review-workspace-500.cjs
      - name: Review Workspace real-browser smoke and responsive screenshots
        run: bash checks/review-workspace-browser-smoke.sh
      - name: Archive 500 review checks and responsive screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: microportmap-review-workspace-500
          path: |
            checks/review-workspace-500-results.json
            checks/review-workspace-screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
      - name: Passport Toolkit 500 implementation and action audit
        run: |
          python3 checks/passport-toolkit-500-audit.py
          node --check src/passport-research-toolkit.js
          node checks/passport-toolkit-500.cjs
      - name: Research passport browser smoke and responsive screenshots
        run: bash checks/passport-toolkit-browser-smoke.sh
      - name: Retain Research Toolkit desktop and mobile captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: microportmap-passport-toolkit-500-previews
          path: checks/passport-toolkit-screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
      - name: Retain 500 passport action audit results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: microportmap-passport-toolkit-500-results
          path: checks/passport-toolkit-500-results.json
          if-no-files-found: warn
          retention-days: 30
      - name: Reported Operators 50 source and syntax audit
        run: |
          python3 checks/operator-explorer-50-audit.py
          node --check src/operator-explorer.js
      - name: Reported Operators browser interaction and responsive smoke
        run: bash checks/operator-explorer-50-browser-smoke.sh
      - name: Retain Reported Operators desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: microportmap-operator-explorer-50
          path: checks/operator-explorer-50-screenshots/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Technology and Equipment 50 source audit
        run: |
          python3 checks/equipment-explorer-50-audit.py
          node --check src/equipment-explorer.js
      - name: Technology equipment interactive browser smoke
        run: bash checks/equipment-explorer-50-browser-smoke.sh
      - name: Retain technology equipment browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: microportmap-equipment-explorer-50
          path: checks/equipment-explorer-50-screenshots/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Floating buttons overlap and arrow-only regression
        run: bash checks/floating-buttons-smoke.sh
      - name: Retain floating-button desktop screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: microportmap-floating-button-fix
          path: checks/floating-button-screenshots/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Country Region 50 source and syntax audit
        run: |
          python3 checks/country-explorer-50-audit.py
          node --check src/country-explorer.js
      - name: Country Explorer real-browser functional smoke
        run: bash checks/country-explorer-50-browser-smoke.sh
      - name: Retain Country Explorer desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: microportmap-country-region-50
          path: checks/country-explorer-50-screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
      - name: Research Insights 50 source and syntax audit
        run: |
          python3 checks/research-insights-50-audit.py
          node --check src/research-insights.js
      - name: Research Insights interactive Chromium smoke and screenshots
        run: bash checks/research-insights-50-browser-smoke.sh
      - name: Retain Research Insights mobile and desktop captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: microportmap-research-insights-50
          path: checks/research-insights-50-screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
      - name: Research Trail 50 source audit
        run: |
          python3 checks/research-trail-50-audit.py
          node --check src/research-trail.js
          node --check src/experience-tools.js
      - name: Browser-local Research Trail functional smoke and screenshots
        run: bash checks/research-trail-50-browser-smoke.sh
      - name: Archive Research Trail visual verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: microportmap-research-trail-50
          path: checks/research-trail-50-screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
      - name: Research experience 50 feature audit
        run: python3 checks/experience-50-audit.py
      - name: Research experience desktop and mobile DOM smoke
        run: bash checks/experience-50-browser-smoke.sh
      - name: Retain research experience screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: microportmap-research-experience-50
          path: checks/experience-50-screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
      - name: Fifty visible interface improvements audit
        run: python3 checks/visual-50-audit.py
      - name: Capture desktop and mobile visual review screenshots
        run: bash checks/visual-50-browser-smoke.sh
      - name: Retain desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: microportmap-visible-release-50-previews
          path: checks/visual-50-screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
      - name: Atlas, directory, comparison and export regression
        run: |
          node --check src/site-redesign.js
          node checks/map-layer-transitions.cjs
          node checks/atlas.cjs
          node checks/directory.cjs
          node checks/passport.cjs
          node checks/compare.cjs
          node checks/record-field-2000.cjs
      - name: Two thousand visible-field safety cases
        run: node checks/visible-fields-2000.cjs
      - name: Two thousand cross-view filter and comparison handoffs
        run: node checks/cross-view-2000.cjs
      - name: Preserve cross-view audit ledgers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: microportmap-cross-view-2000
          path: |
            checks/cross-view-2000-results.json
            checks/cross-view-2000-ledger.json
            checks/cross-view-2000-status.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve visible-field audit ledgers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: microportmap-visible-fields-2000
          path: |
            checks/visible-fields-2000-results.json
            checks/visible-fields-2000-ledger.json
            checks/visible-fields-2000-status.json
          if-no-files-found: warn
          retention-days: 30
