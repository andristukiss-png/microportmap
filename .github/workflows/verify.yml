name: Verify MicroportMap

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Preservation, navigation and recovery
        run: |
          python3 checks/validate.py
          python3 checks/navigation-round12.py
          python3 checks/site-navigation-audit.py
          python3 checks/site-recovery.py
      - name: Contrasting Research 500 source and runtime path audit
        run: |
          python3 checks/contrasting-research-500-audit.py
          node --check src/contrasting-research-paths.js
          node checks/contrasting-research-500.cjs
          node checks/contrast-reliability-500.cjs
      - name: Contrasting Research responsive browser checks
        run: bash checks/contrasting-research-browser-smoke.sh
      - name: Archive Contrasting Research 500 results and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: microportmap-contrasting-research-500
          path: |
            checks/contrasting-research-500-results.json
            checks/contrast-reliability-500-results.json
            checks/contrasting-research-screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
      - name: Finder modal 500 accessibility cases
        run: |
          node checks/finder-modal-500.cjs
          node checks/finder-retry-focus-500.cjs
      - name: Finder modal desktop and mobile browser checks
        run: bash checks/finder-modal-browser-smoke.sh
      - name: Retain finder modal browser captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: microportmap-finder-modal-500
          path: checks/finder-modal-screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
      - name: Shared research loader recovery cases
        run: |
          node --check src/experience-tools.js
          node checks/research-loader-500.cjs
      - name: Country 500 recovery, copy and bookmark feedback cases
        run: |
          node --check src/country-explorer.js
          python3 checks/country-explorer-50-audit.py
          node checks/country-recovery-500.cjs
      - name: Country responsive recovery and bookmark feedback checks
        run: bash checks/country-recovery-browser-smoke.sh
      - name: Retain Country Recovery 500 results and captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: microportmap-country-recovery-500
          path: |
            checks/country-recovery-500-results.json
            checks/country-recovery-screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
      - name: Equipment 500 recovery and filter history cases
        run: |
          node --check src/equipment-explorer.js
          python3 checks/equipment-explorer-50-audit.py
          node checks/equipment-recovery-500.cjs
      - name: Equipment responsive recovery and export checks
        run: bash checks/equipment-recovery-browser-smoke.sh
      - name: Retain Equipment Recovery 500 results and captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: microportmap-equipment-recovery-500
          path: |
            checks/equipment-recovery-500-results.json
            checks/equipment-recovery-screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
      - name: V1 launch 500 passport gates and finite blocker register
        run: python3 checks/v1-launch-500.py
      - name: V1 launch responsive routes and policy disclosures
        run: bash checks/v1-launch-browser-smoke.sh
      - name: Retain V1 launch audit and responsive captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: microportmap-v1-launch-audit-500
          path: |
            checks/v1-launch-500-results.json
            checks/v1-launch-screenshots/*.png
            V1-LAUNCH.md
          if-no-files-found: warn
          retention-days: 30
      - name: Reported Operators 500 recovery and filter history cases
        run: |
          node --check src/operator-explorer.js
          python3 checks/operator-explorer-50-audit.py
          node checks/operator-reliability-500.cjs
      - name: Reported Operators responsive recovery and export checks
        run: bash checks/operator-reliability-browser-smoke.sh
      - name: Retain Operator Recovery 500 results and captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: microportmap-operator-reliability-500
          path: |
            checks/operator-reliability-500-results.json
            checks/operator-reliability-screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
      - name: Research Insights 500 recovery and filter history cases
        run: |
          node --check src/research-insights.js
          python3 checks/research-insights-50-audit.py
          node checks/insights-reliability-500.cjs
      - name: Research Insights responsive recovery and export checks
        run: bash checks/insights-reliability-browser-smoke.sh
      - name: Retain Insights Recovery 500 results and captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: microportmap-insights-reliability-500
          path: |
            checks/insights-reliability-500-results.json
            checks/insights-reliability-screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
      - name: Passport 500 lookup, canonical copy and export recovery cases
        run: |
          node --check src/project-connect.js
          node checks/passport.cjs
          node checks/passport-recovery-500.cjs
      - name: Passport responsive lookup and copy recovery checks
        run: bash checks/passport-recovery-browser-smoke.sh
      - name: Retain Passport Recovery 500 results and captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: microportmap-passport-recovery-500
          path: |
            checks/passport-recovery-500-results.json
            checks/passport-recovery-screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
      - name: Atlas 500 recovery and modal state cases
        run: |
          node --check src/site-redesign.js
          node checks/atlas.cjs
          node checks/atlas-reliability-500.cjs
      - name: Atlas responsive recovery and modal restoration checks
        run: bash checks/atlas-reliability-browser-smoke.sh
      - name: Retain Atlas 500 results and captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: microportmap-atlas-reliability-500
          path: |
            checks/atlas-reliability-500-results.json
            checks/atlas-reliability-screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
      - name: Directory Comparison 500 clipboard and context cases
        run: |
          node --check src/directory-compare.js
          node checks/compare.cjs
          node checks/comparison-reliability-500.cjs
      - name: Directory Comparison responsive copy and export checks
        run: bash checks/comparison-reliability-browser-smoke.sh
      - name: Retain Directory Comparison 500 results and captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: microportmap-comparison-reliability-500
          path: |
            checks/comparison-reliability-500-results.json
            checks/comparison-reliability-screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
      - name: Metadata Review 500 recovery and audit scope cases
        run: |
          node --check src/data-quality.js
          node --check src/review-tools.js
          node --check src/research-audit-export.js
          node checks/quality.cjs
          node checks/quality-reliability-500.cjs
      - name: Metadata Review responsive recovery and export checks
        run: bash checks/quality-reliability-browser-smoke.sh
      - name: Retain Metadata Review 500 results and captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: microportmap-quality-reliability-500
          path: |
            checks/quality-reliability-500-results.json
            checks/quality-reliability-screenshots/*.png
            checks/quality-reliability-diagnostics/*
          if-no-files-found: warn
          retention-days: 30
      - name: Directory 500 recovery and filtered export cases
        run: |
          node --check src/directory.js
          node --check src/directory-json-export.js
          node checks/directory.cjs
          node checks/directory-reliability-500.cjs
      - name: Directory responsive recovery and JSON export checks
        run: bash checks/directory-reliability-browser-smoke.sh
      - name: Retain Directory 500 results and captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: microportmap-directory-reliability-500
          path: |
            checks/directory-reliability-500-results.json
            checks/directory-reliability-screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
      - name: Correction Prefill 500 asynchronous recovery workflows
        run: |
          node --check src/correction-prefill.js
          node checks/behavior.cjs
          node checks/correction-500.cjs
          node checks/correction-prefill-reliability-500.cjs
      - name: Correction Prefill desktop and mobile browser checks
        run: bash checks/correction-prefill-browser-smoke.sh
      - name: Retain Correction Prefill 500 results and captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: microportmap-correction-prefill-500
          path: |
            checks/correction-prefill-reliability-500-results.json
            checks/correction-prefill-screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
      - name: Passport Reading 500 source and runtime action audit
        run: |
          python3 checks/passport-reading-500-audit.py
          node --check src/passport-reading-controls.js
          node checks/passport-reading-500.cjs
          node checks/reading-reliability-500.cjs
      - name: Passport Reading real-browser behavior and responsive captures
        run: bash checks/passport-reading-browser-smoke.sh
      - name: Retain Passport Reading 500 results and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
