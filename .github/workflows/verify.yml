      - name: Atlas, directory, comparison and export regression
        run: |
          node --check src/site-redesign.js
          node checks/map-layer-transitions.cjs
          node checks/atlas.cjs
          node checks/directory.cjs
          node checks/passport.cjs
          node checks/compare.cjs
          node checks/record-field-2000.cjs
      - name: Two thousand visible-field safety cases
        run: node checks/visible-fields-2000.cjs
      - name: Two thousand cross-view filter and comparison handoffs
        run: node checks/cross-view-2000.cjs
