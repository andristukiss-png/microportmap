        with:
          name: microportmap-equipment-explorer-50
          path: checks/equipment-explorer-50-screenshots/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Floating buttons overlap and arrow-only regression
        run: bash checks/floating-buttons-smoke.sh
      - name: Retain floating-button desktop screenshots
